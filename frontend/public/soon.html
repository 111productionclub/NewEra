<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>new era store — скоро</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#000;
       color:#fff;font-family:"Lucida Handwriting","Segoe Script","Comic Sans MS",cursive;
       font-style:italic;letter-spacing:.05em;text-align:center;gap:24px}
  img{width:120px;height:auto}
  #t{font-size:clamp(40px,10vw,96px);font-variant-numeric:tabular-nums;letter-spacing:2px;
     text-shadow:0 2px 16px rgba(0,0,0,.6)}
  p{margin:0;color:#d21115;text-shadow:0 1px 8px rgba(0,0,0,.8)}
</style>
</head>
<body>
  <img src="/img/logo.png" alt="NewEra">
  <div id="t">--:--:--</div>
  <p>25 октября, 18:00 МСК</p>
<script>
  const launch = new Date("2026-10-25T18:00:00+03:00").getTime();
  const el = document.getElementById("t");
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const left = launch - Date.now();
    if (left <= 0) {
      el.textContent = "00:00:00";
      setTimeout(() => location.replace("/"), 5000 + Math.random() * 10000);
      return;
    }
    const s = Math.floor(left / 1000);
    const d = Math.floor(s / 86400);
    const hms = `${pad(Math.floor(s % 86400 / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`;
    el.textContent = d > 0 ? `${d}д ${hms}` : hms;
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
